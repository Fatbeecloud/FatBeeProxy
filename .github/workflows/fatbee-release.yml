# 胖蜜蜂云：云端编译正式版 APK（只能在 GitHub 网页上手动点 Run workflow，或用 gh workflow run 启动）
# 用站长的正式签名密钥签名。密钥和密码存在 GitHub Secrets（加密保险箱）里，不进仓库：
#   FATBEE_RELEASE_KEYSTORE_BASE64   密钥文件（base64）
#   FATBEE_RELEASE_KEYSTORE_PASSWORD 密钥密码
# 以后每次更新都必须用同一把密钥，会员才能直接覆盖升级。
name: FatBee release build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KEY_ALIAS: fatbeecloud

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check signing secrets
      env:
        KS: ${{ secrets.FATBEE_RELEASE_KEYSTORE_BASE64 }}
        PW: ${{ secrets.FATBEE_RELEASE_KEYSTORE_PASSWORD }}
      run: |
        if [ -z "$KS" ] || [ -z "$PW" ]; then
          echo "::error::还没有设置正式签名密钥（FATBEE_RELEASE_KEYSTORE_BASE64 / FATBEE_RELEASE_KEYSTORE_PASSWORD）"
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-ndk30-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        echo "CURRENT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run FatBee unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew testPlaystoreDebugUnitTest --tests 'com.v2ray.ang.fatbee.*'

    - name: Decode signing key
      env:
        KS: ${{ secrets.FATBEE_RELEASE_KEYSTORE_BASE64 }}
      run: echo "$KS" | base64 -d > "$RUNNER_TEMP/fatbee-release.jks"

    # 不加 ABI_FILTERS：同时出通用版（universal，新旧手机都能装）和各芯片的单独版本
    - name: Build release APK
      env:
        PW: ${{ secrets.FATBEE_RELEASE_KEYSTORE_PASSWORD }}
        FATBEE_ACCOUNT_SUFFIX: ${{ secrets.FATBEE_ACCOUNT_SUFFIX }}
        FATBEE_ADMIN_CODE_SHA256: ${{ secrets.FATBEE_ADMIN_CODE_SHA256 }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assemblePlaystoreRelease \
          -PfatbeeAccountSuffix="$FATBEE_ACCOUNT_SUFFIX" -PfatbeeAdminCodeSha256="$FATBEE_ADMIN_CODE_SHA256" \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/fatbee-release.jks" \
          -Pandroid.injected.signing.store.password="$PW" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$PW"

    - name: Remove signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/fatbee-release.jks"

    - name: Show signing certificate (for checking it is the right key)
      run: |
        APK=$(ls ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk | head -1)
        $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$APK" | grep -E "SHA-256|DN" || true

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: fatbee-release-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk
        retention-days: 30

    - name: Upload per-ABI APKs
      uses: actions/upload-artifact@v7
      with:
        name: fatbee-release-per-abi
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk
        retention-days: 30
